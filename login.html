<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - DSOC AI</title>
  <style>
    :root {
      color-scheme: dark;
      --purple:#a855f7;
      --purple-dark:#4c1d95;
      --muted:rgba(235,225,255,.66);
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:#05030d; color:#fff; font-family:var(--font);
      padding:24px; overflow:hidden; -webkit-font-smoothing:antialiased;
    }
    body::before {
      content:""; position:fixed; inset:-20%;
      background:
        radial-gradient(ellipse at 50% 14%, rgba(230,220,255,.30) 0%, rgba(220,200,255,.10) 5%, transparent 14%),
        radial-gradient(ellipse at 50% 18%, rgba(168,85,247,.42) 0%, rgba(124,58,237,.16) 18%, transparent 42%),
        radial-gradient(ellipse at 50% 70%, rgba(76,29,149,.28) 0%, transparent 38%);
      filter:blur(22px); animation:purpleLight 6s ease-in-out infinite alternate; pointer-events:none;
    }
    body::after {
      content:""; position:fixed; inset:0;
      background:
        linear-gradient(rgba(168,85,247,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,.03) 1px, transparent 1px),
        radial-gradient(circle at 50% 52%, transparent 0%, rgba(5,3,13,.78) 58%, #05030d 100%);
      background-size:56px 56px,56px 56px,auto; pointer-events:none;
    }
    @keyframes purpleLight {
      0% { transform:translate3d(-3%, -2%, 0) scale(1); opacity:.72; }
      50% { transform:translate3d(3%, 1%, 0) scale(1.07); opacity:1; }
      100% { transform:translate3d(0, -3%, 0) scale(.98); opacity:.84; }
    }
    .auth-card { width:min(390px,100%); position:relative; z-index:1; text-align:center; padding:18px 16px; }
    .brand { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:14px; margin-bottom:22px; color:rgba(235,225,255,.78); }
    .brand-mark { width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 0 20px rgba(168,85,247,.55)); }
    h1 { font-size:24px; line-height:1.22; margin:0 0 8px; font-weight:700; }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.5; font-size:12px; }
    .tabs { display:flex; gap:4px; padding:4px; background:rgba(168,85,247,.04); border:1px solid rgba(168,85,247,.12); border-radius:12px; margin-bottom:20px; }
    .tab {
      flex:1; padding:9px; border-radius:9px; font-size:13px; font-weight:600;
      color:var(--muted); background:transparent; border:none; cursor:pointer;
      transition:all .2s; font-family:inherit;
    }
    .tab:hover { color:#fff; background:rgba(168,85,247,.08); }
    .tab.active { color:#fff; background:rgba(168,85,247,.20); box-shadow:inset 0 0 0 1px rgba(168,85,247,.30); }
    .panel { display:none; }
    .panel.active { display:block; animation:stepIn .4s ease both; }
    @keyframes stepIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    form { margin-top:12px; padding-top:18px; border-top:1px solid rgba(168,85,247,.18); }
    label { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); }
    .field { position:relative; margin-bottom:10px; border-radius:8px; isolation:isolate; }
    .field::before {
      content:""; position:absolute; inset:-1px; border-radius:9px;
      background:linear-gradient(120deg, transparent, rgba(168,85,247,.78), transparent);
      opacity:0; transform:translateX(-35%); transition:opacity .22s ease, transform .45s ease; z-index:-1;
    }
    .field:focus-within::before { opacity:.55; transform:translateX(0); }
    .field svg {
      position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px;
      color:rgba(220,200,255,.56); transition:color .2s, filter .2s, transform .2s; z-index:1;
    }
    .field:focus-within svg {
      color:#fff; filter:drop-shadow(0 0 8px rgba(168,85,247,.9));
      transform:translateY(-50%) scale(1.08);
    }
    input {
      width:100%; height:44px; border:1px solid rgba(168,85,247,.16);
      background:rgba(168,85,247,.06); color:#fff; border-radius:8px;
      padding:0 12px 0 38px; outline:none; font-size:13px;
      transition:border-color .2s, box-shadow .2s, background .2s, transform .2s;
      font-family:inherit;
    }
    input::placeholder { color:rgba(220,200,255,.42); }
    input:hover { background:rgba(168,85,247,.10); }
    input:focus {
      border-color:rgba(168,85,247,.72); background:rgba(20,12,36,.92);
      box-shadow:0 0 0 3px rgba(168,85,247,.16), 0 12px 34px rgba(168,85,247,.18);
      transform:translateY(-1px);
    }
    button.submit {
      width:100%; height:42px; display:flex; align-items:center; justify-content:center;
      gap:9px; border:0; border-radius:8px; padding:0 12px;
      font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;
      background:linear-gradient(135deg,var(--purple),var(--purple-dark));
      color:#fff; box-shadow:0 12px 32px rgba(168,85,247,.28); margin-top:14px;
      transition:transform .18s, opacity .18s;
    }
    button.submit:hover { transform:translateY(-1px); }
    button.submit:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .msg { border-radius:10px; padding:10px; margin-bottom:14px; font-size:12px; text-align:left; display:none; }
    .msg.show { display:block; animation:stepIn .3s ease both; }
    .msg.error { border:1px solid rgba(255,100,100,.42); background:rgba(255,80,80,.14); color:#ffc9c9; }
    .msg.success { border:1px solid rgba(52,211,153,.42); background:rgba(52,211,153,.14); color:#a7f3d0; }
    .hint { font-size:11px; color:rgba(220,200,255,.55); margin-top:12px; }
    .hint strong { color:#c084fc; font-weight:600; }
    .close-link { display:inline-flex; justify-content:center; margin-top:24px; color:rgba(235,225,255,.78); text-decoration:none; font-size:12px; }
    @media (max-width:480px) { body { padding:18px; } h1 { font-size:22px; } .auth-card { width:100%; } }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand"><img class="brand-mark" src="favicon.png" alt="DSOC AI"> DSOC AI</div>

    <div class="tabs">
      <button class="tab active" id="tab-login">Sign In</button>
      <button class="tab" id="tab-register">Sign Up</button>
    </div>

    <section class="panel active" id="panel-login">
      <h1>Welcome back</h1>
      <p class="sub">Masuk pakai email & password. Data tersimpan di cloud.</p>
      <div class="msg" id="msg-login"></div>
      <form id="form-login">
        <label for="login-email">Email</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="login-email" type="email" autocomplete="email" required placeholder="email" autofocus>
        </div>
        <label for="login-password">Password</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="password">
        </div>
        <button type="submit" class="submit">Sign In</button>
      </form>
    </section>

    <section class="panel" id="panel-register">
      <h1>Create account</h1>
      <p class="sub">Bikin akun baru, langsung aktif. Login dari HP manapun.</p>
      <div class="msg" id="msg-register"></div>
      <form id="form-register">
        <label for="reg-username">Username</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="reg-username" type="text" autocomplete="username" required placeholder="username" minlength="3" maxlength="20">
        </div>
        <label for="reg-email">Email</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="reg-email" type="email" autocomplete="email" required placeholder="email">
        </div>
        <label for="reg-password">Password</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="reg-password" type="password" autocomplete="new-password" required placeholder="password (min 6)" minlength="6">
        </div>
        <button type="submit" class="submit">Create Account</button>
      </form>
      <p class="hint">Username: <strong>3–20 karakter</strong>, huruf/angka/underscore.</p>
    </section>

    <a class="close-link" href="index.html">Close</a>
  </main>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyBnBsf_7wTTWHKPuCqekJUQhg9TMrIraw4",
      authDomain: "dsoc-ai.firebaseapp.com",
      projectId: "dsoc-ai",
      storageBucket: "dsoc-ai.firebasestorage.app",
      messagingSenderId: "867797685440",
      appId: "1:867797685440:web:ae8a51a59300f9f9ca0925"
    };

    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const showMsg = (el, type, text) => { el.className = 'msg show ' + type; el.textContent = text; };
    const hideMsg = (el) => { el.className = 'msg'; };

    const errorId = {
      'auth/email-already-in-use': 'Email sudah terdaftar. Coba login.',
      'auth/invalid-email': 'Format email tidak valid.',
      'auth/weak-password': 'Password terlalu lemah (min 6 karakter).',
      'auth/user-not-found': 'Email tidak ditemukan.',
      'auth/wrong-password': 'Password salah.',
      'auth/invalid-credential': 'Email atau password salah.',
      'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
      'auth/network-request-failed': 'Koneksi internet bermasalah.',
      'auth/unauthorized-domain': 'Domain belum diizinkan di Firebase.'
    };
    const msgErr = (err) => errorId[err?.code] || err?.message || 'Terjadi kesalahan.';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.setItem('dsoc_session', JSON.stringify({
          loggedIn: true, userId: user.uid, email: user.email
        }));
        window.location.replace('index.html');
      }
    });

    const setTab = (which) => {
      const isLogin = which === 'login';
      $('tab-login').classList.toggle('active', isLogin);
      $('tab-register').classList.toggle('active', !isLogin);
      $('panel-login').classList.toggle('active', isLogin);
      $('panel-register').classList.toggle('active', !isLogin);
      hideMsg($('msg-login')); hideMsg($('msg-register'));
    };
    $('tab-login').addEventListener('click', () => setTab('login'));
    $('tab-register').addEventListener('click', () => setTab('register'));

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('msg-login'); hideMsg(msg);
      const btn = e.target.querySelector('button.submit');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        await signInWithEmailAndPassword(auth, $('login-email').value.trim(), $('login-password').value);
        showMsg(msg, 'success', 'Login berhasil! Mengalihkan...');
      } catch (err) {
        showMsg(msg, 'error', msgErr(err));
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    $('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('msg-register'); hideMsg(msg);
      const btn = e.target.querySelector('button.submit');
      const username = $('reg-username').value.trim().toLowerCase();
      const email = $('reg-email').value.trim();
      const password = $('reg-password').value;

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        showMsg(msg, 'error', 'Username harus 3–20 karakter (huruf/angka/underscore).');
        return;
      }

      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        try {
          await setDoc(doc(db, 'users', cred.user.uid), {
            username, email,
            createdAt: new Date().toISOString(),
            credits: 10
          });
        } catch (fsErr) {
          console.warn('Firestore save failed:', fsErr);
        }
        showMsg(msg, 'success', 'Akun dibuat! Mengalihkan...');
      } catch (err) {
        showMsg(msg, 'error', msgErr(err));
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
